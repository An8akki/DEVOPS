name: Boston Housing MLOps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

defaults:
  run:
    working-directory: DVC-ML-Pipeline

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax Check
        run: |
          python -m py_compile src/*.py

  train_and_evaluate:
    needs: test

    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DVC Pipeline
        run: |
          dvc repro

      - name: Upload Trained Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: DVC-ML-Pipeline/model.pkl

      - name: Upload Metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: DVC-ML-Pipeline/metrics.json

  deploy_to_huggingface:
    needs: train_and_evaluate

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: DVC-ML-Pipeline

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install huggingface_hub

      - name: Download Model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: DVC-ML-Pipeline

      - name: Download Metrics
        uses: actions/download-artifact@v4
        with:
          name: metrics
          path: DVC-ML-Pipeline

      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ vars.HF_REPO_ID }}
        run: |
          python src/deploy_huggingface.py
